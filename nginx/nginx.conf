worker_processes auto;
events { worker_connections 1024; }

http {
  include     mime.types;
  default_type application/octet-stream;
  sendfile    on;
  gzip        on;
  gzip_types  text/plain application/json application/javascript text/css;

  upstream express_backend { server backend:3001; }
  upstream supabase_kong   { server kong:8000; }
  upstream supabase_studio { server studio:3000; }

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Main HTTPS server
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    # Express API
    location /api/ {
      proxy_pass         http://express_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Supabase REST (PostgREST)
    location /rest/ {
      proxy_pass         http://supabase_kong/rest/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Supabase Auth (GoTrue)
    location /auth/ {
      proxy_pass         http://supabase_kong/auth/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Supabase Edge Functions
    location /functions/ {
      proxy_pass         http://supabase_kong/functions/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Supabase Storage
    location /storage/ {
      proxy_pass         http://supabase_kong/storage/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Supabase Realtime (WebSocket)
    location /realtime/ {
      proxy_pass          http://supabase_kong/realtime/;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade    $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_set_header    Host       $host;
    }

    # Vue SPA — must be last
    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # Supabase Studio — restrict at firewall to admin network only
  server {
    listen 5555;
    location / {
      proxy_pass         http://supabase_studio;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }
  }
}
